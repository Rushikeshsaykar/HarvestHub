name: harvesthub
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.5


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  firebase_core: ^5.0.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2E7D32"
  adaptive_icon_foreground: "assets/icon/bglogo.png"


flutter:

  
  uses-material-design: true

  
  assets:
    - assets/images/
    - assets/icon/
  
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/font/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf
          
        
    - family: plusjak
      fonts:
        - asset: assets/font/PlusJakartaSans-VariableFont_wght.ttf
        
  
